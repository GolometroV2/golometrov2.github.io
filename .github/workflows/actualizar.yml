name: Actualizar Mister Fantasy

on:
  schedule:
    - cron: '0 0 * * *' # Todos los días a las 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

# Evita que dos ejecuciones se solapen y se pisen al subir cambios
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar script extractor
        env:
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: python mister_extractor.py

      - name: Guardar y subir cambios
        run: |
          git config user.name "Bot Mister"
          git config user.email "bot@users.noreply.github.com"
          git add mister_fantasy_data.json cache_mister.json
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Actualización automática de datos de la liga"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            echo "Intento $i fallido, reintentando..."
            sleep 5
          done
          exit 1
