name: Actualizar Mister Fantasy

on:
  schedule:
    - cron: '0 0 * * *' # Todos los días a las 00:00 UTC
  workflow_dispatch:

# Añadimos los permisos aquí arriba para autorizar al bot:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar script extractor
        run: |
          python mister_extractor.py

      - name: Guardar y subir cambios al repositorio
        run: |
          git config --global user.name "Bot Mister"
          git config --global user.email "bot@example.com"
          git add mister_fantasy_data.json
          git commit -m "Actualización automática de datos de la liga" || exit 0
          git push
