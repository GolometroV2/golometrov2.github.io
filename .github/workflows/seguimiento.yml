name: Seguimiento de plantillas

# GitHub no garantiza los cron frecuentes: a menudo los retrasa horas. Por eso cada ejecución
# vigila las plantillas durante ~50 minutos (una comprobación cada 5) y al terminar se relanza
# a sí misma. El cron horario es solo una red de seguridad por si la cadena se interrumpe.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Grupo propio (distinto del de actualizar.yml) para que nunca se cancelen entre sí
concurrency:
  group: seguimiento
  cancel-in-progress: false

jobs:
  seguimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Vigilar plantillas durante unos 50 minutos
        env:
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: |
          git config user.name "Bot Mister"
          git config user.email "bot@users.noreply.github.com"
          FIN=$((SECONDS + 3000))
          FALLOS=0
          ULTIMO_EXT=-100000
          while true; do
            if python seguimiento_equipos.py; then FALLOS=0; else FALLOS=$((FALLOS + 1)); fi
            python calendario_mister.py || echo "Aviso: no se pudo actualizar el calendario"
            # Puntos en directo: mientras haya un partido en juego (o acabado hace menos de 3 h), se relee
            # la clasificación de Mister cada 15 minutos para que la web muestre los puntos de la jornada en curso.
            # Al arrancar una jornada, los onces guardados son de antes del primer partido y Mister tarda un rato
            # en cerrarlos: hasta tener una lectura de al menos 5 minutos después del primer partido de la jornada
            # (la que usa la «Previa de la jornada»), se relee en cada vuelta, es decir, cada 5 minutos.
            CADA=900
            if python3 -c "import json,time,sys,datetime;c=json.load(open('calendario.json'));d=json.load(open('mister_fantasy_data.json'));t=time.time();v=[g['gw'] for g in c.get('games',[]) if 0<(g.get('ts') or 0)<=t<=(g.get('ts') or 0)+3*3600];p=min((g['ts'] for g in c['games'] if v and g.get('gw')==v[0] and g.get('ts')),default=0);u=datetime.datetime.fromisoformat(d['updatedAt'].replace('Z','+00:00')).timestamp();sys.exit(0 if v and u<p+300 else 1)" 2>/dev/null; then CADA=240; fi
            if python3 -c "import json,time,sys;c=json.load(open('calendario.json'));t=time.time();sys.exit(0 if any(0<(g.get('ts') or 0)<=t<=(g.get('ts') or 0)+3*3600 for g in c.get('games',[])) else 1)" 2>/dev/null && [ $((SECONDS - ULTIMO_EXT)) -ge $CADA ]; then
              ULTIMO_EXT=$SECONDS
              if python mister_extractor.py > /tmp/extractor.log 2>&1; then
                git add mister_fantasy_data.json
                [ -f cache_mister.json ] && git add cache_mister.json
              else
                echo "Aviso: no se pudo leer la clasificación en directo"; tail -5 /tmp/extractor.log
              fi
            fi
            # Red de seguridad del mercado: GitHub a veces no lanza sus ejecuciones programadas. Si ya son las 06:30
            # en Madrid y hoy no se ha leído el mercado, se lanza su flujo (como mucho una vez cada 45 minutos).
            HM=$(TZ=Europe/Madrid date +%H%M); HOY=$(TZ=Europe/Madrid date +%F)
            ULTM=$(python3 -c "import json,datetime,zoneinfo;m=json.load(open('mercado.json'));print(datetime.datetime.fromisoformat(m['updatedAt']).astimezone(zoneinfo.ZoneInfo('Europe/Madrid')).date())" 2>/dev/null || echo nunca)
            if [ "$((10#$HM))" -ge 630 ] && [ "$ULTM" != "$HOY" ] && [ $((SECONDS - ${ULTIMO_MER:--100000})) -ge 2700 ]; then
              ULTIMO_MER=$SECONDS
              echo "El mercado de hoy aún no se ha leído: se lanza su flujo."
              GH_TOKEN="${{ github.token }}" gh workflow run mercado.yml --repo "${{ github.repository }}" --ref main || echo "Aviso: no se pudo lanzar el mercado"
            fi
            if [ -f equipos.json ]; then git add equipos.json; fi
            if [ -f calendario.json ]; then git add calendario.json; fi
            if [ -d avatars ]; then git add avatars; fi
            if [ -d fotos ]; then git add fotos; fi
            if ! git diff --staged --quiet; then
              git commit -m "Seguimiento de plantillas, calendario y puntos en directo: cambios detectados"
              for i in 1 2 3; do
                if git pull --rebase -X theirs origin main && git push origin main; then break; fi
                sleep 5
              done
            fi
            if [ $SECONDS -ge $FIN ]; then break; fi
            sleep 300
          done
          if [ $FALLOS -ge 3 ]; then
            echo "Las últimas comprobaciones han fallado: revisa las credenciales (secretos)."
            exit 1
          fi

      - name: Relanzar la vigilancia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run seguimiento.yml --ref ${{ github.ref_name }}
