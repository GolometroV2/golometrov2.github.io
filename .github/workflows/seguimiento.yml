name: Seguimiento de plantillas

on:
  schedule:
    - cron: '*/15 * * * *' # Cada 15 minutos
  workflow_dispatch:

permissions:
  contents: write

# Comparte grupo con el otro workflow para que nunca suban cambios a la vez
concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  seguimiento:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Actualizar equipos
        env:
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: python seguimiento_equipos.py

      - name: Guardar y subir cambios
        run: |
          git config user.name "Bot Mister"
          git config user.email "bot@users.noreply.github.com"
          git add equipos.json
          if [ -d avatars ]; then git add avatars; fi
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Seguimiento de plantillas: cambios detectados"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin main; then
              exit 0
            fi
            echo "Intento $i fallido, reintentando..."
            sleep 5
          done
          exit 1
