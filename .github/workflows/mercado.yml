name: Mercado

# El mercado del juego se renueva a las 05:00 (hora de Madrid) y tarda un rato en actualizarse.
# Se lee a las 06:30 de invierno (05:30 UTC); en horario de verano GitHub lo ejecuta a las 07:30.
on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercado
  cancel-in-progress: false

jobs:
  mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Leer el mercado (hasta 3 intentos)
        env:
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: |
          for i in 1 2 3; do
            if python mercado_mister.py; then OK=1; break; fi
            sleep 300
          done
          if [ -z "$OK" ]; then echo "No se pudo leer el mercado: revisa las credenciales (secretos)."; exit 1; fi

      - name: Guardar cambios
        run: |
          git config user.name "Bot Mister"
          git config user.email "bot@users.noreply.github.com"
          git add mercado.json mercado_historial.json
          if ! git diff --staged --quiet; then
            git commit -m "Mercado actualizado"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin main; then break; fi
              sleep 5
            done
          fi
