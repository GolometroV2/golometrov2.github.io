name: Mercado

# El mercado del juego se renueva a las 05:00 (hora de Madrid) y tarda un rato en actualizarse.
# GitHub programa en UTC, así que hay dos horarios (invierno y verano) y el primer paso comprueba
# cuál toca: solo sigue si en Madrid son las 06:xx. Si se lanza a mano, siempre sigue.
on:
  schedule:
    # GitHub retrasa las ejecuciones programadas a veces varias horas (y se salta algunas).
    # Por eso hay un disparo cada hora y los primeros a la hora exacta de Madrid. Cada uno comprueba
    # si ya son las 06:00 o mas en Madrid y si hoy todavia no se ha leido el mercado; solo el primero trabaja.
    - cron: '30 4 * * *'
    - cron: '30 5 * * *'
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mercado
  cancel-in-progress: false

jobs:
  mercado:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Comprobar la hora de Madrid
        id: hora
        run: |
          H=$(TZ=Europe/Madrid date +%H)
          HOY=$(TZ=Europe/Madrid date +%F)
          ULT=$(python3 -c "import json,datetime,zoneinfo;m=json.load(open('mercado.json'));d=datetime.datetime.fromisoformat(m.get('updatedAt') or m.get('updated'));print(d.astimezone(zoneinfo.ZoneInfo('Europe/Madrid')).date().isoformat())" 2>/dev/null || echo nunca)
          echo "Hora en Madrid: $H | hoy: $HOY | ultima lectura: $ULT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$((10#$H))" -lt 6 ] || [ "$ULT" = "$HOY" ]; then
              echo "No toca (antes de las 06:00 o ya leido hoy): se omite esta ejecucion."
              echo "seguir=no" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "seguir=si" >> "$GITHUB_OUTPUT"

      - name: Configurar Python
        if: steps.hora.outputs.seguir == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        if: steps.hora.outputs.seguir == 'si'
        run: pip install requests beautifulsoup4

      - name: Leer el mercado (reintenta hasta que se renueve)
        if: steps.hora.outputs.seguir == 'si'
        env:
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: |
          # Reintenta cada 10 minutos (hasta ~2 horas) si el mercado aún no se ha renovado,
          # y hasta 3 veces seguidas si falla por otro motivo (red, credenciales...).
          FALLOS=0
          for i in $(seq 1 12); do
            python mercado_mister.py && { OK=1; break; }
            CODIGO=$?
            if [ $CODIGO -ne 2 ]; then
              FALLOS=$((FALLOS + 1))
              if [ $FALLOS -ge 3 ]; then break; fi
            fi
            sleep 600
          done
          if [ -z "$OK" ]; then echo "No se pudo leer el mercado: revisa las credenciales (secretos) o si el juego tardó más de 2 horas."; exit 1; fi

      - name: Leer todos los jugadores de la liga
        if: steps.hora.outputs.seguir == 'si'
        env:
          MISTER_COOKIE: ${{ secrets.MISTER_COOKIE }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
        run: |
          python jugadores_mister.py || echo "Aviso - no se pudo leer la lista de jugadores"

      - name: Guardar cambios
        if: steps.hora.outputs.seguir == 'si'
        run: |
          git config user.name "Bot Mister"
          git config user.email "bot@users.noreply.github.com"
          git add mercado.json mercado_historial.json
          if [ -f jugadores.json ]; then git add jugadores.json jugadores_historial.json; fi
          if ! git diff --staged --quiet; then
            git commit -m "Mercado actualizado"
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin main && git push origin main; then break; fi
              sleep 5
            done
          fi
