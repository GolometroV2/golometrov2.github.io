name: Diagnostico agente
on:
  workflow_dispatch:
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Probar el token directamente
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "SECRETO VACIO"; exit 0; fi
          echo "Secreto presente, longitud ${#CLAUDE_CODE_OAUTH_TOKEN}, empieza por ${CLAUDE_CODE_OAUTH_TOKEN:0:10}"
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version
          claude -p "responde solo OK" --output-format json 2>&1 | head -c 1500 || true
