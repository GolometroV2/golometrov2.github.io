name: Agente de mejoras

# MODO INTENSIVO hasta el 20/11/2026: una ejecucion cada hora (se encolan, nunca van dos a la vez).
# Despues vuelve solo al ritmo normal: una vez a la semana (martes).
# Todo el trabajo va a UNA rama (agente/semana) y UNA Pull Request abierta; tu la aceptas cuando quieras.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

concurrency:
  group: agente
  cancel-in-progress: false

jobs:
  agente:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Comprobar si toca
        id: toca
        run: |
          HOY=$(TZ=Europe/Madrid date +%F)
          DIA=$(TZ=Europe/Madrid date +%u)
          HORA=$(TZ=Europe/Madrid date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [[ "$HOY" > "2026-11-20" ]] && { [ "$DIA" != "2" ] || [ "$((10#$HORA))" -ne 8 ]; }; then
            echo "Fuera del modo intensivo: solo martes a las 08 de Madrid."
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          else
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.toca.outputs.seguir == 'si'
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: steps.toca.outputs.seguir == 'si'
        with:
          python-version: '3.11'

      - name: Preparar pruebas con navegador
        if: steps.toca.outputs.seguir == 'si'
        run: |
          pip install requests beautifulsoup4 playwright
          python -m playwright install --with-deps chromium

      - name: Agente
        if: steps.toca.outputs.seguir == 'si'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: '*'
          prompt: |
            Sigue las reglas de CLAUDE.md (seccion MODO INTENSIVO). Ejecucion automatica sin supervision:
            trabaja en la rama agente/semana (crea o actualizala desde main y rebasala sobre main),
            elige una sola mejora segun MEJORAS.md y los datos, pruebala con Playwright, haz commit,
            sube la rama, actualiza MEJORAS.md y asegura que existe UNA Pull Request abierta de
            agente/semana hacia main. Si no encuentras nada que merezca la pena, no cambies nada.
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh pr:*),Bash(python:*),Bash(python3:*),Bash(node:*),Bash(pip:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*),Bash(cp:*)"

      - name: Encadenar la siguiente ejecucion (modo intensivo)
        if: steps.toca.outputs.seguir == 'si' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub retrasa mucho el cron horario: al terminar, esta ejecucion lanza la siguiente.
          # Solo durante el modo intensivo (hasta el 20/11/2026) y con una pausa de 2 minutos.
          HOY=$(TZ=Europe/Madrid date +%F)
          if [[ "$HOY" > "2026-11-20" ]]; then echo "Fin del modo intensivo."; exit 0; fi
          sleep 120
          gh workflow run agente.yml --repo "${{ github.repository }}" --ref main
