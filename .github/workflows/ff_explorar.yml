name: Explorar Futbol Fantasy (temporal)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a mirar'
        default: 'https://www.futbolfantasy.com/laliga/posibles-alineaciones'
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: Mirar
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          UA="Mozilla/5.0 (compatible; GolometroBot/1.0; uso personal de una liga privada)"
          echo "=== robots.txt ==="; curl -sS -A "$UA" https://www.futbolfantasy.com/robots.txt | head -60
          echo "=== $URL ==="
          curl -sS -A "$UA" -o /tmp/p.html -w "HTTP %{http_code} bytes %{size_download}\n" "$URL"
          python3 - <<"PY"
          import re
          h=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          h=re.sub(r'<script.*?</script>|<style.*?</style>|<svg.*?</svg>|<!--.*?-->','',h,flags=re.S)
          def limpio(s):
              s=re.sub(r' data-total[A-Za-z]+="[^"]*"','',s)
              s=re.sub(r'<span class="forma view alineacion-valor.*?</span>','',s,flags=re.S)
              s=re.sub(r'<span class="forma view (nacionalidad|altura).*?</span>','',s,flags=re.S)
              return re.sub(r'\s+',' ',s)
          for nombre in ['cristian-romero','julian-lvarez']:
              i=h.find('/jugadores/'+nombre)
              j=h.rfind('<div class="jugador_',0,i)
              print("=====",nombre); print(limpio(h[j:j+7000])[:2600])
          for m in list(re.finditer(r'data-lesion="([0-9])"',h))[:3]:
              print("=== lesion",m.group(1)); print(limpio(h[m.start()-700:m.start()+2200])[:1800])
          PY
