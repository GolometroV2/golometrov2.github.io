name: Explorar Futbol Fantasy (temporal)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a mirar'
        default: 'https://www.futbolfantasy.com/laliga/posibles-alineaciones'
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: Mirar
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          UA="Mozilla/5.0 (compatible; GolometroBot/1.0; uso personal de una liga privada)"
          echo "=== robots.txt ==="; curl -sS -A "$UA" https://www.futbolfantasy.com/robots.txt | head -60
          echo "=== $URL ==="
          curl -sS -A "$UA" -o /tmp/p.html -w "HTTP %{http_code} bytes %{size_download}\n" "$URL"
          python3 - <<"PY"
          import re, collections
          h=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          print("clases campo-wrapper:",set(re.findall(r'class="([^"]*campo-wrapper[^"]*)"',h)))
          pr=re.findall(r'data-probabilidad="([^"]*)"',h); print("probabilidad:",collections.Counter(pr))
          on=re.findall(r'data-onceFF="([^"]*)"',h); print("onceFF:",collections.Counter(on))
          print("lesion:",collections.Counter(re.findall(r'data-lesion="([^"]*)"',h)))
          print("jugadores href:",len(set(re.findall(r'href="(https://www.futbolfantasy.com/jugadores/[^"]+)"',h))))
          # por cada camiseta: nombre y probabilidad
          for m in list(re.finditer(r'<div class="jugador_(\d+)[^"]*"[^>]*data-onceFF="([^"]*)"',h))[:30]:
              seg=h[m.start():m.start()+6000]
              pb=re.search(r'data-probabilidad="([^"]*)"',seg); hr=re.search(r'href="https://www.futbolfantasy.com/jugadores/([^"/]+)',seg)
              print(m.group(1),m.group(2),pb and pb.group(1),hr and hr.group(1))
          for k in ['data-match-p11-team','suplentes','convocad','data-estado','data-porcent','probabilidad-titular','prob-']:
              print(k,h.count(k))
          i=h.find('class="forma-left view probabilidad')
          print(re.sub(r'\s+',' ',h[i-200:i+500]))
          PY
