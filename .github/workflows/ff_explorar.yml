name: Explorar Futbol Fantasy (temporal)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL a mirar'
        default: 'https://www.futbolfantasy.com/laliga/posibles-alineaciones'
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: Mirar
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          UA="Mozilla/5.0 (compatible; GolometroBot/1.0; uso personal de una liga privada)"
          echo "=== robots.txt ==="; curl -sS -A "$UA" https://www.futbolfantasy.com/robots.txt | head -60
          echo "=== $URL ==="
          curl -sS -A "$UA" -o /tmp/p.html -w "HTTP %{http_code} bytes %{size_download}\n" "$URL"
          python3 - <<"PY"
          import re
          h=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          print("longitud",len(h))
          print("enlaces /partidos/:",sorted(set(re.findall(r'href="([^"]*?/partidos/[^"]+)"',h)))[:20])
          print("scripts con json:",[m[:120] for m in re.findall(r'<script[^>]*>(.{0,200})',h,re.S)][:8])
          for k in ['titular','duda','probab','porcentaje','data-','%']:
              print(k,h.lower().count(k))
          i=h.find('class="player')
          print("trozo jugador:",h[i-300:i+900] if i>0 else "no hay class=player")
          print("---- cuerpo (texto de 3000 a 6000) ----")
          print(re.sub(r'\s+',' ',h)[3000:6000])
          PY
