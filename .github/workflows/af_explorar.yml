name: Explorar Analitica Fantasy (temporal)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL'
        default: 'https://www.analiticafantasy.com'
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: Mirar
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          UA="Mozilla/5.0 (compatible; GolometroBot/1.0; uso personal de una liga privada)"
          echo "=== robots ==="; curl -sS -A "$UA" https://www.analiticafantasy.com/robots.txt | head -40
          curl -sS -A "$UA" -o /tmp/p.html -w "HTTP %{http_code} bytes %{size_download}\n" "$URL"
          python3 - <<"PY"
          import re, collections
          h=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          links=sorted(set(re.findall(r'href="(/[^"#?]*)"',h)))
          print([l for l in links if 'alinea' in l or 'partido' in l][:40])
          for k in ['titular','probab','porcentaje','%']:
              print(k, h.lower().count(k))
          # trozos con porcentajes
          txt=re.sub(r'<script.*?</script>|<style.*?</style>','',h,flags=re.S)
          for m in list(re.finditer(r'(\d{1,3})\s*%',txt))[:6]:
              print('---', re.sub(r'\s+',' ',txt[m.start()-700:m.end()+200]))
          # datos embebidos de Next (self.__next_f)
          print('next_f:', h.count('self.__next_f'))
          i=h.find('probab'); print('PROBAB:', h[i-600:i+600])
          PY
