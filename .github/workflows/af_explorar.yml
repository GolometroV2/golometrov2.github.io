name: Explorar Analitica Fantasy (temporal)
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL'
        default: 'https://www.analiticafantasy.com'
jobs:
  e:
    runs-on: ubuntu-latest
    steps:
      - name: Mirar
        env:
          URL: ${{ github.event.inputs.url }}
        run: |
          UA="Mozilla/5.0 (compatible; GolometroBot/1.0; uso personal de una liga privada)"
          echo "=== robots ==="; curl -sS -A "$UA" https://www.analiticafantasy.com/robots.txt | head -40
          curl -sS -A "$UA" -o /tmp/p.html -w "HTTP %{http_code} bytes %{size_download}\n" "$URL"
          python3 - <<"PY"
          import re, collections
          h=open('/tmp/p.html',encoding='utf-8',errors='replace').read()
          import json
          print('next_f:', h.count('self.__next_f'))
          chunks=re.findall(r'self\.__next_f\.push\(\[1,"(.*?)"\]\)</script>',h,re.S)
          data=''.join(c.encode().decode('unicode_escape',errors='ignore') for c in chunks)
          print('len rsc', len(data))
          for kw in ['probab','titular','starter','"percent','lineup','doubt','duda']:
              idx=[m.start() for m in re.finditer(kw,data,re.I)][:3]; print(kw, len(re.findall(kw,data,re.I)), idx)
          for nm in ['Lamine','Griezmann','Pedri']:
              i=data.find(nm); print('==',nm,i); print(data[max(0,i-1200):i+800] if i>0 else '')
          ks=re.findall(r'"([a-zA-Z]*(?:[Pp]rob|[Pp]ercent|[Ss]tart|[Tt]itular|[Cc]hance)[a-zA-Z]*)":',data)
          import collections; print(collections.Counter(ks).most_common(30))
          PY
