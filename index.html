<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Golómetro V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Paleta "Carbón y verde". Para probar otra, copia sus valores sobre estos:
   Esmeralda y dorado -> --acc:#f5c542; --accTxt:#1a1500
   Verde menta        -> --acc:#19d3a2; --accTxt:#042119 */
:root{--bg:#111315;--panel:#1a1d21;--panel2:#23272d;--line:#2f353c;--txt:#f4f6f5;--mut:#9aa3ad;--acc:#2fd46e;--accTxt:#05210f;
--pt:#ffc94a;--df:#4cc3ff;--mc:#a3e635;--dl:#ff6b7a;--red:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.nav{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.nav div{max-width:680px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo span{color:var(--acc)}
.refresh{background:var(--acc);color:var(--accTxt);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.refresh:hover{filter:brightness(1.1)}
.acciones{display:flex;gap:8px;align-items:center}
main{max-width:680px;margin:0 auto;padding:16px}
.head h1{margin:0;font-size:22px;font-weight:800}
.head p{margin:2px 0 14px;color:var(--mut);font-size:13px}
.pills,.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pills::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--panel2);border-radius:999px;padding:7px 16px;font-weight:600;color:var(--mut)}
.pill.on{background:var(--acc);color:var(--accTxt)}
.tabs{margin:16px 0 8px;border-bottom:1px solid var(--line);gap:18px}
.tab{flex:none;padding:8px 0;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--txt);border-color:var(--acc)}
ul{list-style:none;margin:0;padding:0}
.row{border-bottom:1px solid var(--line)}
.rowbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px}
.rowbtn:hover{background:var(--panel)}
.pos{width:22px;text-align:center;font-weight:700;color:var(--mut)}
.row:nth-child(-n+3) .pos{color:var(--acc)}
.av{position:relative;overflow:hidden;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none;color:#fff}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub i{font-style:normal;margin-right:8px}
.sub .z{opacity:.4}
.pts{text-align:right;line-height:1.1}
.pts b{font-size:24px;font-weight:800}
.pts small{font-size:12px;color:var(--mut);margin-left:3px}
.pts em{display:block;font-style:normal;font-size:12px;color:var(--red);margin-top:2px}
.det{background:var(--panel);border-radius:12px;margin:0 0 12px;padding:14px}
.det h3{margin:0 0 10px;font-size:14px;color:var(--mut);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.bar>span:first-child{width:30px;color:var(--mut);font-weight:600}
.bar i{display:block;height:8px;background:var(--acc);border-radius:4px}
.bar b{min-width:24px}
.top{color:var(--mut);font-size:13px;margin:10px 0 0}
.pitch{background:repeating-linear-gradient(180deg,#2a7d47 0 44px,#26733f 44px 88px);border-radius:12px;padding:14px 6px;display:flex;flex-direction:column;gap:14px}
.line{display:flex;justify-content:space-around;gap:4px}
.pl{display:flex;flex-direction:column;align-items:center;width:20%;min-width:0}
.pc{position:relative;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#111315;border:2px solid #fff}
.pl.off .pc{background:#5d6f64!important;color:#cfd8d2}
.cap{position:absolute;top:-6px;right:-8px;background:#fff;color:#111315;border-radius:50%;width:16px;height:16px;font-size:10px;display:grid;place-items:center}
.pn{max-width:100%;font-size:11.5px;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #0008}
.pe{font-size:11px;min-height:14px}
.form{color:var(--mut);font-size:13px;margin:0 0 8px}
.card{background:var(--panel);border-radius:12px;padding:14px;margin-top:20px}
.gh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
.gh h2{margin:0;font-size:16px}
.seg{display:flex;background:var(--panel2);border-radius:8px;padding:2px}
.seg button{padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--accTxt)}
.gbtn{display:flex;gap:6px;margin-bottom:8px}
.gbtn button{background:var(--panel2);border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--mut)}
.gbtn button:hover{color:var(--txt)}
.chipsg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.gchip{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:4px 11px 4px 8px;font-size:12.5px;font-weight:600;color:var(--mut)}
.gchip i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35}
.gchip.on{border-color:var(--c);color:var(--txt);background:var(--panel2)}
.gchip.on i{opacity:1}
.gwrap{position:relative;touch-action:pan-y}
.tip{display:none;position:absolute;top:4px;background:#111315ee;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;pointer-events:none;min-width:130px;z-index:2}
.tip strong{display:block;margin-bottom:3px}
.tip div{display:flex;align-items:center;gap:6px}
.tip div b{margin-left:auto;padding-left:10px}
.tip i{width:8px;height:8px;border-radius:50%;flex:none}
.cp{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.cp:last-child{border-bottom:0}
.cp .n{width:20px;text-align:center;font-weight:800;color:var(--mut)}
.cp:nth-child(-n+3) .n{color:var(--acc)}
.cp .qui{flex:1;min-width:0}
.cp .fn{font-weight:600;display:flex;align-items:center;gap:6px}
.cp .fn i{width:9px;height:9px;border-radius:50%;flex:none}
.cp .by{color:var(--mut);font-size:12.5px;display:flex;align-items:center;gap:6px;margin-top:2px}
.cp .by .av{width:20px;height:20px;font-size:9px}
.cp .rec{text-align:right;line-height:1.1}
.cp .rec b{font-size:24px;font-weight:800;color:var(--acc)}
.cp .rec small{display:block;color:var(--mut);font-size:12px;margin-top:2px;white-space:nowrap}
.note{color:var(--mut);font-size:13px;margin:8px 0 0}
.up{color:var(--acc)}.dn{color:var(--red)}.flat{color:var(--mut)}
.pts em.up{color:var(--acc)}.pts em.flat{color:var(--mut)}
.mini{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.mini span{background:var(--panel2);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.pj{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pj .dot{width:10px;height:10px;border-radius:50%;flex:none}
.pj svg{flex:none}
.pj .val{text-align:right;line-height:1.15;min-width:84px}
.pj .val b{font-size:16px;font-weight:700}
.pj .val small{display:block;font-size:12px;color:var(--mut)}
.tend{display:inline-block;margin-top:3px;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
.t-sube_acel,.t-sube_const,.t-sube_1{background:#2fd46e26;color:var(--acc)}
.t-sube_frena{background:#ffc94a26;color:var(--pt)}
.t-baja_frena{background:#4cc3ff26;color:var(--df)}
.t-baja_const,.t-baja_acel,.t-baja_1{background:#ff6b6b26;color:var(--red)}
.t-plano,.t-nd{background:var(--panel2);color:var(--mut)}
.mv{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.mv:last-child{border-bottom:0}
.mv small{display:block;color:var(--mut);font-size:12px}
.msg{text-align:center;color:var(--mut);padding:48px 16px}
code{color:var(--acc)}
</style>
</head>
<body>
<header class="nav"><div>
  <div class="logo">Golómetro <span>V2</span></div>
  <span class="acciones">
    <!-- TEMPORAL: botón de carga manual, oculto (quita el style="display:none" para volver a verlo) -->
    <label class="refresh" id="tmp-carga" style="display:none">📂 Cargar JSON<input id="file" type="file" accept=".json" hidden></label>
    <button class="refresh" onclick="cargarDatos()">🔄 Actualizar</button>
  </span>
</div></header>
<main>
  <div class="head"><h1 id="titulo">Mi liga</h1><p id="sub"></p></div>
  <div class="tabs" id="nav" role="group" aria-label="Sección"></div>
  <div id="app"><div class="msg">Cargando datos de la liga...</div></div>
  <div id="eq" hidden></div>
</main>

<script>
const POS = ["PT", "DF", "MC", "DL"];
// Qué cuentan las columnas "Capitán" y "Sin capitán":
//   "extra" -> solo los puntos que añade el multiplicador (x1.5, x2 o x3)
//   "total" -> todos los puntos del capitán (ya multiplicados)
const MODO_CAP = "extra";
const METRICAS = [["points", "Puntos", "Pts"], ["sinCap", "Sin capitán", "Pts"], ["cap", "Capitán", "Pts"], ["goals", "Goles", "Goles"], ["assists", "Asistencias", "Asist."],
  ["goalsConceded", "Encajados", "Enc."], ["yellow", "Amarillas", "Amar."], ["redCards", "Rojas", "Rojas"]];
let D = null, vista = "General", orden = { k: "points", asc: false }, abierto = null;
let visibles = new Set(), modoG = "acum", G = null;
let E = null, seccion = "clas", eqSel = "resumen", eqOrden = "delta";

let equiposDesbloqueados = false;
const PASS_EQUIPOS = "9248";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const jornadas = () => Object.keys(D.matchdays || {}).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
const col = i => `hsl(${Math.round((i * 360 / Math.max((D || E || { managers: [] }).managers.length, 1) + 200) % 360)} 70% 58%)`;
const fondo = (m, i) => Number.isFinite(m.hue) ? `hsl(${m.hue} 50% 50%)` : col(i);
const total = m => jornadas().reduce((t, j) => t + (((D.matchdays[j] || {})[m.id] || {}).points || 0), 0);
const topIds = n => D.managers.map(m => [m.id, total(m)]).sort((a, b) => b[1] - a[1]).slice(0, n).map(x => x[0]);

function avatar(m, i) {
  const img = m.avatarUrl ? `<img src="${esc(m.avatarUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onload="this.previousElementSibling.style.visibility='hidden'" onerror="this.remove()">` : "";
  return `<span class="av" style="background:${fondo(m, i)}"><span>${esc(m.avatar || "MF")}</span>${img}</span>`;
}

function cargar(obj) {
  if (!obj || !Array.isArray(obj.managers) || !obj.matchdays) {
    alert("El JSON no tiene el formato esperado (faltan managers o matchdays).");
    return;
  }
  D = obj; vista = "General"; abierto = null; modoG = "acum";
  visibles = new Set(D.managers.map(m => m.id));
  D.hayCap = jornadas().some(j => Object.values(D.matchdays[j] || {}).some(x => x && x.captain));
  $("#titulo").textContent = obj.leagueName || "Mi liga";
  $("#sub").textContent = [obj.season, obj.lastUpdated && "actualizado " + obj.lastUpdated].filter(Boolean).join(" · ");
  pintar();
}

function cargarEquipos() {
  fetch("equipos.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(j => { E = j; if (seccion === "eq") pintarEquipos(); })
    .catch(() => {});
}

function pintarNav() {
  $("#nav").innerHTML = [["clas", "🏆 Clasificación"], ["eq", "💰 Equipos"]]
    .map(([k, t]) => `<button class="tab ${seccion === k ? "on" : ""}" data-s="${k}">${t}</button>`).join("");
}

function ir(sec) {
  if (sec === "eq" && !equiposDesbloqueados) {
    const pwd = prompt("Introduce la contraseña para acceder a la sección de Equipos:");
    if (pwd !== PASS_EQUIPOS) {
      alert("Contraseña incorrecta.");
      return;
    }
    equiposDesbloqueados = true;
  }
  seccion = sec;
  $("#app").hidden = sec !== "clas";
  $("#eq").hidden = sec !== "eq";
  pintarNav();
  if (sec === "eq") pintarEquipos();
}

function cargarDatos() {
  cargarEquipos();
  $("#app").innerHTML = `<div class="msg">Actualizando datos de la liga...</div>`;
  fetch("mister_fantasy_data.json?t=" + Date.now(), { cache: "no-store" })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(cargar)
    .catch(() => {
      $("#app").innerHTML = `<div class="msg">No se pudo actualizar el archivo <code>mister_fantasy_data.json</code>.<br>Comprueba que el proceso automático de GitHub ha finalizado correctamente.</div>`;
    });
}

// Carga automática inicial al abrir la página
cargarDatos();
pintarNav();

// ===== TEMPORAL: carga manual del JSON para pruebas (borrar este bloque y el <label id="tmp-carga">) =====
function leerArchivo(f) {
  if (!f) return;
  const r = new FileReader();
  r.onload = e => { try { const j = JSON.parse(e.target.result); if (j && j.history) { E = j; pintarEquipos(); } else cargar(j); } catch (err) { alert("Error al leer el JSON: " + err.message); } };
  r.readAsText(f);
}
$("#file").onchange = e => { leerArchivo(e.target.files[0]); e.target.value = ""; };
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); leerArchivo(e.dataTransfer.files[0]); });
// ===== FIN TEMPORAL =====

function estadisticas() {
  const js = vista === "General" ? jornadas() : [vista];
  return D.managers.map((m, idx) => {
    const s = { ...m, idx, points: 0, cap: 0, sinCap: 0, goals: 0, assists: 0, yellow: 0, redCards: 0, goalsConceded: 0 };
    js.forEach(j => {
      const x = (D.matchdays[j] || {})[m.id];
      if (!x) return;
      s.points += x.points || 0; s.goals += x.goals || 0; s.cap += capPts(x);
      s.redCards += x.redCards || 0; s.goalsConceded += x.goalsConceded || 0;
      (x.players || []).forEach(p => { s.assists += p.assists || 0; s.yellow += p.yellowCards || 0; });
    });
    s.sinCap = s.points - s.cap;
    return s;
  }).sort((a, b) => (a[orden.k] - b[orden.k]) * (orden.asc ? 1 : -1) || b.points - a.points || a.name.localeCompare(b.name));
}

const capPts = x => {
  const c = x && x.captain;
  if (!c) return 0;
  return MODO_CAP === "total" ? (c.points || 0) : (c.bonus || 0);
};
const rep = (e, n) => n ? (n <= 3 ? e.repeat(n) : e + "×" + n) : "";
const suma = (x, c) => (x.players || []).reduce((t, p) => t + (p[c] || 0), 0);

function jugador(p) {
  const ev = rep("⚽", p.goals) + rep("👟", p.assists) + rep("🟨", p.yellowCards) + rep("🟥", p.redCards) + (p.ownGoals ? "PP" : "");
  const corto = String(p.name || "").split(" ").slice(-1)[0];
  return `<div class="pl ${p.played ? "" : "off"}"><div class="pc" style="background:var(--${esc(String(p.pos).toLowerCase())})">${p.played ? esc(p.points) : "–"}${p.captain ? '<b class="cap">C</b>' : ""}</div>
    <span class="pn" title="${esc(p.name)}">${esc(corto)}</span><span class="pe">${ev}</span></div>`;
}

function detalle(m) {
  if (vista !== "General") {
    const x = (D.matchdays[vista] || {})[m.id];
    if (!x || !(x.players || []).length) return `<p class="top">No hay alineación guardada para esta jornada.</p>`;
    const lineas = ["DL", "MC", "DF", "PT"].map(pos => {
      const ps = x.players.filter(p => p.pos === pos);
      return ps.length ? `<div class="line">${ps.map(jugador).join("")}</div>` : "";
    }).join("");
    return `<p class="form">Formación ${esc(x.formation || "—")}</p><div class="pitch">${lineas}</div>`;
  }
  const js = jornadas();
  const pts = js.map(j => ((D.matchdays[j] || {})[m.id] || {}).points || 0);
  const max = Math.max(...pts, 1);
  const barras = js.map((j, i) => {
    const x = (D.matchdays[j] || {})[m.id] || {};
    const ev = rep("⚽", x.goals || 0) + " " + rep("👟", suma(x, "assists")) + " " + rep("🟨", suma(x, "yellowCards")) + " " + rep("🟥", x.redCards || 0);
    return `<div class="bar"><span>${esc(j)}</span><i style="width:${Math.max(pts[i], 0) / max * 55}%"></i><b>${pts[i]}</b><span>${ev}</span></div>`;
  }).join("");
  const gol = {};
  js.forEach(j => (((D.matchdays[j] || {})[m.id] || {}).players || []).forEach(p => { if (p.goals) gol[p.name] = (gol[p.name] || 0) + p.goals; }));
  const top = Object.entries(gol).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([n, g]) => `${esc(n)} ⚽${g}`).join(" · ");
  return `<h3>Puntos por jornada</h3>${barras}<p class="top">${top ? "Goleadores: " + top : "Sin goles registrados."}</p>`;
}

/* ---------- Gráfica interactiva ---------- */
function pintarGrafico() {
  const cont = $("#graf");
  if (!cont) return;
  const js = jornadas();
  if (js.length < 2) { cont.innerHTML = ""; return; }

  const lista = D.managers.map((m, i) => ({ m, i, t: total(m) })).sort((a, b) => b.t - a.t);
  const chips = lista.map(({ m, i }) => `<button class="gchip ${visibles.has(m.id) ? "on" : ""}" data-g="${esc(m.id)}" style="--c:${col(i)}" aria-pressed="${visibles.has(m.id)}"><i></i>${esc(m.name)}</button>`).join("");
  const series = lista.filter(o => visibles.has(o.m.id)).map(({ m, i }) => {
    let a = 0;
    return { m, i, v: js.map(j => { const p = ((D.matchdays[j] || {})[m.id] || {}).points || 0; return modoG === "acum" ? (a += p) : p; }) };
  });

  const W = 640, H = 240, L = 36, R = 14, T = 12, B = 26;
  const todos = series.flatMap(s => s.v);
  const max = Math.max(...todos, 1), min = Math.min(0, ...todos);
  const X = i => L + i * (W - L - R) / (js.length - 1), Y = v => H - B - (v - min) * (H - B - T) / (max - min);
  G = { W, L, R, js, series, X };

  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = Math.round(min + (max - min) * k / 4);
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2f353c"/><text x="${L - 5}" y="${Y(v) + 4}" text-anchor="end" fill="#9aa3ad" font-size="11">${v}</text>`;
  }
  js.forEach((j, i) => g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" fill="#9aa3ad" font-size="11">${esc(j)}</text>`);
  g += `<line id="guide" y1="${T}" y2="${H - B}" stroke="#9aa3ad" stroke-dasharray="3 3" style="visibility:hidden"/>`;
  series.forEach(s => {
    g += `<polyline fill="none" stroke="${col(s.i)}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${s.v.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>`;
    g += s.v.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${col(s.i)}"/>`).join("");
  });

  cont.innerHTML = `
    <div class="gh"><h2>Evolución de puntos</h2>
      <div class="seg"><button data-gm="acum" class="${modoG === "acum" ? "on" : ""}">Acumulados</button><button data-gm="jor" class="${modoG === "jor" ? "on" : ""}">Por jornada</button></div></div>
    <div class="gbtn"><button data-gs="all">Todos</button><button data-gs="top">Top 3</button><button data-gs="none">Ninguno</button></div>
    <div class="chipsg">${chips}</div>
    ${series.length ? `<div class="gwrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block" role="img" aria-label="Evolución de puntos por jornada">${g}</svg><div class="tip" id="tip"></div></div>`
      : `<div class="msg">Selecciona al menos un jugador para ver la gráfica.</div>`}`;

  const wrap = cont.querySelector(".gwrap");
  if (wrap) {
    wrap.onpointermove = e => {
      const r = wrap.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width * G.W;
      const i = Math.max(0, Math.min(G.js.length - 1, Math.round((x - G.L) / ((G.W - G.L - G.R) / (G.js.length - 1)))));
      const px = G.X(i), guide = $("#guide"), tip = $("#tip");
      guide.setAttribute("x1", px); guide.setAttribute("x2", px); guide.style.visibility = "visible";
      tip.innerHTML = `<strong>${esc(G.js[i])}</strong>` + G.series.slice().sort((a, b) => b.v[i] - a.v[i])
        .map(s => `<div><i style="background:${col(s.i)}"></i>${esc(s.m.name)}<b>${s.v[i]}</b></div>`).join("");
      const pct = px / G.W * 100;
      tip.style.display = "block";
      tip.style.left = pct < 55 ? `calc(${pct}% + 10px)` : "auto";
      tip.style.right = pct < 55 ? "auto" : `calc(${100 - pct}% + 10px)`;
    };
    wrap.onpointerleave = () => { $("#guide").style.visibility = "hidden"; $("#tip").style.display = "none"; };
  }
}

/* ---------- Top 5 capitanes ---------- */
function pintarCapitanes() {
  const cont = $("#caps");
  if (!cont) return;
  if (!D.hayCap) { cont.innerHTML = ""; return; }
  const lista = [];
  jornadas().forEach(j => D.managers.forEach((m, i) => {
    const c = ((D.matchdays[j] || {})[m.id] || {}).captain;
    if (c && c.played) lista.push({ j, m, i, c });
  }));
  lista.sort((a, b) => b.c.points - a.c.points || (b.c.bonus || 0) - (a.c.bonus || 0));
  const filas = lista.slice(0, 5).map(({ j, m, i, c }, k) => `
    <li class="cp">
      <span class="n">${k + 1}</span>
      <span class="qui">
        <span class="fn"><i style="background:var(--${esc(String(c.pos).toLowerCase())})"></i>${esc(c.name)}</span>
        <span class="by">${avatar(m, i)} ${esc(m.name)} · ${esc(j)}</span>
      </span>
      <span class="rec"><b>${c.points}</b><small>${c.basePoints != null ? esc(c.basePoints) + " base · " : ""}${c.multiplier ? "x" + esc(c.multiplier) + " · " : ""}${c.bonus >= 0 ? "+" : ""}${c.bonus} extra</small></span>
    </li>`).join("");
  cont.innerHTML = `<h2 style="margin:0 0 4px;font-size:16px">Top 5 capitanes</h2>
    <p class="note" style="margin:0 0 6px">Mejores puntuaciones conseguidas con el capitán (ya multiplicadas).</p>
    ${filas ? `<ul>${filas}</ul>` : `<p class="note">Aún no hay capitanes que hayan jugado.</p>`}`;
}

/* ---------- Equipos: seguimiento de plantillas ---------- */
const nf = new Intl.NumberFormat("es-ES", { maximumFractionDigits: 2 });
const eur = v => Math.abs(v) >= 1e6 ? nf.format(v / 1e6) + " M" : nf.format(Math.round(v / 1e3)) + " k";
const sig = v => (v > 0 ? "+" : v < 0 ? "−" : "") + eur(Math.abs(v));
const cl = v => v > 0 ? "up" : v < 0 ? "dn" : "flat";
const ETIQ = { sube_acel: "Subiendo · acelerando", sube_const: "Subiendo · ritmo constante", sube_frena: "Subiendo · frenando", sube_1: "Subiendo",
  baja_frena: "Bajando · frenando la caída", baja_const: "Bajando · ritmo constante", baja_acel: "Bajando · cada día más", baja_1: "Bajando",
  plano: "Estable", nd: "Sin datos" };
const RANGO = { baja_acel: 0, sube_frena: 1, baja_const: 2, baja_1: 2, baja_frena: 3, plano: 4, sube_const: 5, sube_1: 5, sube_acel: 6, nd: 7 };
const nombreM = id => (E.managers.find(m => m.id === id) || {}).name || "Alguien";

// h = historial del jugador: [[fecha, valor, valorAnterior], ...]. El cambio diario de cada entrada es valor - valorAnterior.
function tendencia(h) {
  const d = (h || []).slice(-6).map(e => e[1] - e[2]);
  const n = d.length;
  if (!n) return { k: "nd", d: 0, pct: 0, n: 0 };
  const ult = d[n - 1], pct = ult / Math.max(h[h.length - 1][1] - ult, 1);
  if (Math.abs(pct) < 0.003) return { k: "plano", d: ult, pct, n };
  if (n < 2) return { k: ult > 0 ? "sube_1" : "baja_1", d: ult, pct, n };
  const pend = (d[n - 1] - d[0]) / (n - 1);   // cuánto cambia el cambio diario cada día
  const tol = Math.abs(ult) * 0.15;
  let k, eta = null;
  if (ult > 0) {
    if (pend > tol) k = "sube_acel";
    else if (pend < -tol) { k = "sube_frena"; eta = Math.ceil(ult / -pend); }
    else k = "sube_const";
  } else {
    if (pend < -tol) k = "baja_acel";
    else if (pend > tol) { k = "baja_frena"; eta = Math.ceil(-ult / pend); }
    else k = "baja_const";
  }
  return { k, d: ult, pct, n, eta };
}

function spark(h, k) {
  if (!h.length) return "";
  const w = h.slice(-8), vals = [w[0][2], ...w.map(e => e[1])];
  const W = 64, H = 22, mn = Math.min(...vals), rg = Math.max(Math.max(...vals) - mn, 1);
  const pts = vals.map((v, i) => `${(i * (W - 4) / (vals.length - 1) + 2).toFixed(1)},${(H - 3 - (v - mn) / rg * (H - 6)).toFixed(1)}`).join(" ");
  const c = k.startsWith("sube") ? "var(--acc)" : k.startsWith("baja") ? "var(--red)" : "var(--mut)";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline style="fill:none;stroke:${c};stroke-width:2;stroke-linejoin:round;stroke-linecap:round" points="${pts}"/></svg>`;
}

function textoMov(t) {
  const j = `<b>${esc(t.name)}</b>`, v = t.value ? ` (${eur(t.value)})` : "";
  if (!t.from) return `<b>${esc(nombreM(t.to))}</b> ficha a ${j}${v} desde el mercado`;
  if (!t.to) return `<b>${esc(nombreM(t.from))}</b> vende a ${j}${v} al mercado`;
  return `<b>${esc(nombreM(t.to))}</b> compra a ${j}${v} a <b>${esc(nombreM(t.from))}</b>`;
}

function resumenEq(ms, hp) {
  const filas = ms.slice().sort((a, b) => b.squadValue - a.squadValue).map((m, k) => {
    const d = m.squadValue - m.squadPrev;
    const ts = m.players.map(p => tendencia(hp(p.id)).k);
    const sube = ts.filter(t => t.startsWith("sube")).length, baja = ts.filter(t => t.startsWith("baja")).length, frena = ts.filter(t => t === "sube_frena").length;
    return `<li class="row"><button class="rowbtn" data-e="${esc(m.id)}"><span class="pos">${k + 1}</span>${avatar(m, m.i)}
      <span class="info"><span class="nm">${esc(m.name)}</span><span class="sub">${m.players.length} jugadores · ▲${sube} ▼${baja}${frena ? " · ⚠ " + frena + " frenando" : ""}</span></span>
      <span class="pts"><b>${eur(m.squadValue)}</b><em class="${cl(d)}">${sig(d)}</em></span></button></li>`;
  }).join("");
  const mv = (E.transfers || []).slice(0, 10).map(t => `<li class="mv">${textoMov(t)}<small>${esc(t.date)}</small></li>`).join("");
  return `<ul style="margin-top:12px">${filas}</ul>
    <section class="card"><h2 style="margin:0 0 4px;font-size:16px">Últimos movimientos</h2>${mv ? `<ul>${mv}</ul>` : `<p class="note">Aún no se ha detectado ningún fichaje ni venta.</p>`}</section>`;
}

function detalleEq(m, hp) {
  const L = m.players.map(p => ({ p, h: hp(p.id), t: tendencia(hp(p.id)) }));
  const dM = m.squadValue - m.squadPrev;
  const ord = { delta: (a, b) => b.t.d - a.t.d, valor: (a, b) => b.p.value - a.p.value,
    alerta: (a, b) => RANGO[a.t.k] - RANGO[b.t.k] || b.p.value - a.p.value }[eqOrden];
  const sorts = [["delta", "Cambio diario"], ["valor", "Valor"], ["alerta", "Alertas primero"]]
    .map(([k, t]) => `<button class="pill ${eqOrden === k ? "on" : ""}" data-es="${k}">${t}</button>`).join("");
  const filas = L.sort(ord).map(({ p, t, h }) => {
    const eta = t.eta && t.eta <= 30 ? (t.k === "sube_frena" ? ` · empezará a bajar en ~${t.eta} d` : ` · podría recuperarse en ~${t.eta} d`) : "";
    return `<li class="pj"><i class="dot" style="background:var(--${esc(String(p.pos).toLowerCase())})"></i>
      <span class="info"><span class="nm">${esc(p.name)}</span><span class="sub">${esc(p.pos)} · valor ${eur(p.value)}${p.clause ? " · cláusula " + eur(p.clause) : ""}</span>
        <span><span class="tend t-${t.k}">${ETIQ[t.k]}${eta}${t.n > 0 && t.n < 3 ? " · pocos datos" : ""}</span></span></span>
      ${spark(h, t.k)}
      <span class="val"><b class="${cl(t.d)}">${sig(t.d)}</b><small>${(t.pct > 0 ? "+" : "") + nf.format(t.pct * 100)} %</small></span></li>`;
  }).join("");
  const sube = L.filter(x => x.t.k.startsWith("sube")).length, baja = L.filter(x => x.t.k.startsWith("baja")).length;
  return `<section class="card" style="margin-top:12px"><div style="display:flex;align-items:center;gap:12px">${avatar(m, m.i)}
      <div style="flex:1;min-width:0"><div class="nm">${esc(m.name)}</div><div class="sub">Valor de plantilla</div></div>
      <div class="pts"><b>${eur(m.squadValue)}</b><em class="${cl(dM)}">${sig(dM)} hoy</em></div></div>
    <div class="mini"><span class="up">▲ ${sube} subiendo</span><span style="color:var(--pt)">⚠ ${L.filter(x => x.t.k === "sube_frena").length} frenando</span><span class="dn">▼ ${baja} bajando</span></div></section>
    <div class="pills" role="group" aria-label="Ordenar" style="margin-top:12px">${sorts}</div>
    <ul>${filas}</ul>
    <p class="note">Las tendencias son estimaciones lineales a partir de los cambios diarios guardados; mejoran cuantos más días acumule el historial.</p>`;
}

function pintarEquipos() {
  const cont = $("#eq");
  if (!E) { cont.innerHTML = `<div class="msg">Todavía no hay datos de equipos.<br>Se generan con <code>seguimiento_equipos.py</code>.</div>`; return; }
  const hp = id => (E.history || {})[id] || [];
  const ms = E.managers.map((m, i) => ({ ...m, i }));
  const pills = [["resumen", "Resumen"], ...ms.map(m => [m.id, m.name])]
    .map(([id, t]) => `<button class="pill ${eqSel === id ? "on" : ""}" data-e="${esc(id)}">${esc(t)}</button>`).join("");
  const sel = ms.find(x => x.id === eqSel);
  cont.innerHTML = `<p class="note" style="margin:0 0 10px">Último cambio: ${esc(E.updated || "—")} · se actualiza cuando cambian las plantillas o los valores.</p>
    <div class="pills" role="group" aria-label="Equipo">${pills}</div>${sel ? detalleEq(sel, hp) : resumenEq(ms, hp)}`;
}

/* ---------- Lista principal ---------- */
function pintar() {
  const meta = METRICAS.find(x => x[0] === orden.k);
  const rank = estadisticas();
  const lider = rank.length ? rank[0][orden.k] : 0;
  const pills = ["General", ...jornadas()].map(j => `<button class="pill ${vista === j ? "on" : ""}" data-v="${esc(j)}">${j === "General" ? "Total" : esc(j)}</button>`).join("");
  const tabs = METRICAS.map(([k, t]) => `<button class="tab ${orden.k === k ? "on" : ""}" data-o="${k}">${t}${orden.k === k ? (orden.asc ? " ↑" : " ↓") : ""}</button>`).join("");
  const z = (e, n) => `<i class="${n ? "" : "z"}">${e}${n}</i>`;
  const filas = rank.map((m, i) => `
    <li class="row">
      <button class="rowbtn" data-m="${esc(m.id)}" aria-expanded="${abierto === m.id}">
        <span class="pos">${i + 1}</span>
        ${avatar(m, m.idx)}
        <span class="info"><span class="nm">${esc(m.name)}</span>
          <span class="sub">${z("⚽", m.goals)}${z("👟", m.assists)}${z("🟨", m.yellow)}${z("🟥", m.redCards)}${z("🥅", m.goalsConceded)}</span></span>
        <span class="pts"><b>${m[orden.k]}</b><small>${meta[2]}</small>${["points", "sinCap", "cap"].includes(orden.k) && !orden.asc && m[orden.k] !== lider ? `<em>${m[orden.k] - lider}</em>` : ""}</span>
      </button>
      ${abierto === m.id ? `<div class="det">${detalle(m)}</div>` : ""}
    </li>`).join("");

  $("#app").innerHTML = `
    <div class="pills" role="group" aria-label="Jornada">${pills}</div>
    <div class="tabs" role="group" aria-label="Ordenar por">${tabs}</div>
    ${!D.hayCap && ["cap", "sinCap"].includes(orden.k) ? `<p class="note">El JSON todavía no incluye datos de capitán: ejecuta de nuevo el extractor.</p>` : ""}
    <ul>${filas}</ul>
    <section class="card" id="graf"></section>
    <section class="card" id="caps"></section>`;
  pintarGrafico();
  pintarCapitanes();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-v],[data-o],[data-m],[data-g],[data-gs],[data-gm],[data-s],[data-e],[data-es]");
  if (!t) return;
  const d = t.dataset;
  if (d.s) { ir(d.s); return; }
  if (d.e !== undefined) { eqSel = d.e; pintarEquipos(); return; }
  if (d.es) { eqOrden = d.es; pintarEquipos(); return; }
  if (!D) return;
  if (d.g !== undefined || d.gs !== undefined || d.gm !== undefined) {
    if (d.g !== undefined) visibles.has(d.g) ? visibles.delete(d.g) : visibles.add(d.g);
    else if (d.gs === "all") visibles = new Set(D.managers.map(m => m.id));
    else if (d.gs === "none") visibles = new Set();
    else if (d.gs === "top") visibles = new Set(topIds(3));
    else if (d.gm) modoG = d.gm;
    pintarGrafico();
    return;
  }
  if (d.v) { vista = d.v; abierto = null; }
  else if (d.o) { orden = orden.k === d.o ? { k: d.o, asc: !orden.asc } : { k: d.o, asc: false }; }
  else if (d.m) { abierto = abierto === d.m ? null : d.m; }
  pintar();
});
</script>
