<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mister Fantasy Pro Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1712;--card:#16231b;--card2:#1c2d22;--line:#2b4033;--txt:#eef3ee;--mut:#8fa596;--g:#4ade80;--y:#facc15;--r:#f87171;--b:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 Barlow,system-ui,sans-serif;padding:16px}
.wrap{max-width:1100px;margin:0 auto}
h1,h2,.num,th{font-family:'Barlow Condensed',Barlow,sans-serif}
h1{font-size:34px;margin:0;line-height:1}
h2{font-size:22px;margin:0 0 12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
.sub{color:var(--mut);margin:4px 0 0}
.load{background:var(--g);color:#06220f;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips b{color:var(--mut);font-weight:600;margin-right:4px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.chip.on{background:var(--g);color:#06220f;border-color:var(--g);font-weight:600}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{font-size:16px;font-weight:600;color:var(--mut);text-align:center;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.l{text-align:left}
th button{background:none;border:0;color:inherit;font:inherit;padding:0}
th.on{color:var(--g)}
td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
td.l{text-align:left}
.num{font-size:22px;font-weight:700}
.who{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;width:100%;padding:0}
.rk{width:24px;color:var(--mut);font-family:'Barlow Condensed',sans-serif;font-size:18px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none;font-size:13px}
.team{color:var(--mut);font-size:12px}
.tag{display:inline-block;background:var(--card2);border-radius:4px;padding:0 5px;margin-right:3px;font-size:12px;color:var(--mut)}
.det td{background:var(--card2);text-align:left;padding:12px}
.det table{min-width:0}
.det td,.det th{border:0;padding:4px 8px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px}
.pl div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:3px 0}
.off{color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:3px 0}
.bar i{display:block;height:10px;background:var(--g);border-radius:3px}
.bar span:first-child{width:34px;color:var(--mut)}
.bar .ev{margin-left:4px;white-space:nowrap}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;color:var(--mut);font-size:13px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.empty{text-align:center;padding:48px 16px;border:1px dashed var(--line);border-radius:12px;color:var(--mut)}
code{color:var(--g)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 id="titulo">Mister Fantasy Pro Stats</h1>
      <p class="sub" id="sub">Estadísticas de tu liga por jornada</p>
    </div>
    <button class="load" onclick="location.reload()">🔄 Actualizar Datos</button>
  </div>
  <div id="app"><div class="empty">Cargando datos de la liga...</div></div>
</div>

<script>
const POS = ["PT", "DF", "MC", "DL"];
let D = null, vista = "General", orden = { k: "points", asc: false }, abierto = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const jornadas = () => Object.keys(D.matchdays || {}).sort((a, b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));
const color = m => esc(m.color || "#3b82f6");

function cargar(obj) {
  if (!obj || !Array.isArray(obj.managers) || !obj.matchdays) {
    alert("El JSON no tiene el formato esperado (faltan managers o matchdays).");
    return;
  }
  D = obj; vista = "General"; abierto = null;
  $("#titulo").textContent = obj.leagueName || "Mister Fantasy Pro Stats";
  $("#sub").textContent = [obj.season, obj.lastUpdated && "actualizado " + obj.lastUpdated].filter(Boolean).join(" · ");
  pintar();
}

// Carga automática indispensable para Netlify
fetch("mister_fantasy_data.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(cargar)
  .catch(() => {
    $("#app").innerHTML = `<div class="empty">No se pudo cargar automáticamente el archivo <code>mister_fantasy_data.json</code>.<br>Comprueba que está subido en el repositorio junto a este index.html.</div>`;
  });

function estadisticas() {
  const js = vista === "General" ? jornadas() : [vista];
  return D.managers.map(m => {
    const s = { ...m, points: 0, goals: 0, assists: 0, yellow: 0, redCards: 0, goalsConceded: 0, pos: { PT: 0, DF: 0, MC: 0, DL: 0 } };
    js.forEach(j => {
      const x = (D.matchdays[j] || {})[m.id];
      if (!x) return;
      s.points += x.points || 0; 
      s.goals += x.goals || 0;
      s.redCards += x.redCards || 0; 
      s.goalsConceded += x.goalsConceded || 0;
      POS.forEach(p => s.pos[p] += (x.goalsByPos || {})[p] || 0);
      (x.players || []).forEach(p => { s.assists += p.assists || 0; s.yellow += p.yellowCards || 0; });
    });
    return s;
  }).sort((a, b) => (a[orden.k] - b[orden.k]) * (orden.asc ? 1 : -1) || b.points - a.points || a.name.localeCompare(b.name));
}

function detalle(m) {
  if (vista !== "General") {
    const x = (D.matchdays[vista] || {})[m.id];
    if (!x || !(x.players || []).length) return `<p class='off'>No hay alineación detallada guardada para esta jornada.</p>`;
    const ordenPl = x.players.slice().sort((a, b) => POS.indexOf(a.pos) - POS.indexOf(b.pos));
    return `<p class="off">Formación ${esc(x.formation || "—")}</p><div class="pl">` + ordenPl.map(p => {
      const ic = "⚽".repeat(p.goals || 0) + "👟".repeat(p.assists || 0) + "🟨".repeat(p.yellowCards || 0) + "🟥".repeat(p.redCards || 0) + (p.ownGoals ? " PP" : "");
      return `<div class="${p.played ? "" : "off"}"><span><span class="tag">${esc(p.pos)}</span>${esc(p.name)}${p.captain ? " (C)" : ""} ${ic}</span><b>${p.played ? esc(p.points) : "no jugó"}</b></div>`;
    }).join("") + "</div>";
  }
  const js = jornadas();
  const pts = js.map(j => ((D.matchdays[j] || {})[m.id] || {}).points || 0);
  const max = Math.max(...pts, 1);
  const barras = js.map((j, i) => {
    return `<div class="bar"><span>${esc(j)}</span><i style="width:${Math.max(pts[i], 0) / max * 60}%"></i><span>${pts[i]}</span></div>`;
  }).join("");
  return `<h2>Puntos por jornada</h2>${barras}`;
}

function grafico() {
  const js = jornadas();
  if (js.length < 2) return "";
  const series = D.managers.map(m => { let a = 0; return { m, v: js.map(j => a += ((D.matchdays[j] || {})[m.id] || {}).points || 0) }; });
  const max = Math.max(...series.flatMap(s => s.v), 1), W = 800, H = 260, L = 38, R = 10, T = 10, B = 26;
  const X = i => L + i * (W - L - R) / (js.length - 1), Y = v => H - B - v * (H - B - T) / max;
  let g = "";
  for (let k = 0; k <= 4; k++) {
    const v = Math.round(max * k / 4);
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#2b4033"/><text x="${L - 5}" y="${Y(v) + 4}" text-anchor="end" fill="#8fa596" font-size="11">${v}</text>`;
  }
  js.forEach((j, i) => g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" fill="#8fa596" font-size="11">${esc(j)}</text>`);
  series.forEach(s => g += `<polyline fill="none" stroke="${color(s.m)}" stroke-width="2.5" stroke-linejoin="round" points="${s.v.map((v, i) => X(i) + "," + Y(v)).join(" ")}"/>`);
  return `<section class="card"><h2>Evolución de puntos acumulados</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%" role="img" aria-label="Evolución de puntos acumulados por jornada">${g}</svg>
  <div class="leg">${series.map(s => `<span><i style="background:${color(s.m)}"></i>${esc(s.m.name)}</span>`).join("")}</div></section>`;
}

function pintar() {
  const cols = [["points", "Puntos"], ["goals", "Goles"], [null, "PT / DF / MC / DL"], ["assists", "Asist."], ["goalsConceded", "Encajados"], ["yellow", "Amarillas"], ["redCards", "Rojas"]];
  const rank = estadisticas();
  const chips = ["General", ...jornadas()].map(j => `<button class="chip ${vista === j ? "on" : ""}" data-v="${esc(j)}">${j === "General" ? "General (acumulado)" : esc(j)}</button>`).join("");
  const cab = cols.map(([k, t]) => k ? `<th class="${orden.k === k ? "on" : ""}"><button data-o="${k}">${t}${orden.k === k ? (orden.asc ? " ↑" : " ↓") : ""}</button></th>` : `<th>${t}</th>`).join("");
  
  const filas = rank.map((m, i) => {
    const ptsCell = `<td class="num" style="color:var(--g)">${m.points}</td>`;
    const goalsCell = `<td class="num" style="color:var(--b)">${m.goals}</td>`;

    return `
    <tr>
      <td class="l"><button class="who" data-m="${esc(m.id)}" aria-expanded="${abierto === m.id}">
        <span class="rk">${i + 1}</span><span class="av" style="background:${color(m)}">${esc(m.avatar || "MF")}</span>
        <span><b>${esc(m.name)}</b><br><span class="team">${esc(m.teamName)}</span></span></button></td>
      ${ptsCell}
      ${goalsCell}
      <td>${POS.map(p => `<span class="tag">${p}${m.pos[p]}</span>`).join("")}</td>
      <td class="num">${m.assists}</td>
      <td class="num" style="color:var(--y)">${m.goalsConceded}</td>
      <td class="num">${m.yellow}</td>
      <td class="num" style="color:var(--r)">${m.redCards}</td>
    </tr>${abierto === m.id ? `<tr class="det"><td colspan="8">${detalle(m)}</td></tr>` : ""}`;
  }).join("");

  $("#app").innerHTML = `
    <section class="card chips"><b>Vista</b>${chips}</section>
    <section class="card scroll"><table><thead><tr><th class="l">Manager (pulsa para ver el detalle)</th>${cab}</tr></thead><tbody>${filas}</tbody></table></section>
    ${grafico()}`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-v],[data-o],[data-m]");
  if (!t || !D) return;
  if (t.dataset.v) { vista = t.dataset.v; abierto = null; }
  else if (t.dataset.o) { const k = t.dataset.o; orden = orden.k === k ? { k, asc: !orden.asc } : { k, asc: false }; }
  else if (t.dataset.m) { abierto = abierto === t.dataset.m ? null : t.dataset.m; }
  pintar();
});
</script>
</body>
</html>
